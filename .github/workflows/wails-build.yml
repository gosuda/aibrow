name: Wails Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.build-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            build-name: aibrow-linux-amd64
            package: binary
          - os: windows-latest
            platform: windows/amd64
            build-name: aibrow-windows-amd64
            package: binary
          - os: macos-latest
            platform: darwin/amd64
            build-name: aibrow-macos-amd64
            package: app
          - os: macos-latest
            platform: darwin/arm64
            build-name: aibrow-macos-arm64
            package: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Generate app icon
        shell: bash
        run: |
          mkdir -p build
          ffmpeg -f lavfi -i "color=c=0x8ab4f8:s=1024x1024" -frames:v 1 build/appicon.png

      - name: Build Wails app
        shell: bash
        run: |
          wails build \
            -platform ${{ matrix.platform }} \
            -ldflags "-X main.version=${GITHUB_REF_NAME:-dev}" \
            -o ${{ matrix.build-name }}

      - name: Package macOS app
        if: matrix.package == 'app'
        shell: bash
        run: |
          cd build/bin
          zip -r ${{ matrix.build-name }}.zip ${{ matrix.build-name }}.app

      - name: Set release files
        id: release_files
        shell: bash
        run: |
          if [ "${{ matrix.package }}" == "app" ]; then
            echo "files=build/bin/${{ matrix.build-name }}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "files=build/bin/${{ matrix.build-name }}*" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build-name }}
          path: build/bin/*

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_files.outputs.files }}
